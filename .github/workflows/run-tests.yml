name: BrowserStack Low Code Tests

on:
  workflow_dispatch: # This allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Test Suite
        id: trigger_test_suite
        run: |
          response=$(curl -u ${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }} -X POST https://lcnc-api.browserstack.com/api/v1/test-suite/25588cdad86ca85058df0e907aa550f23662289f/run)
          BUILD_ID=$(echo $response | jq -r '.build_id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Check Build Status
        run: |
          buildStatus=""
          retryInterval=30
          BUILD_ID=${{ steps.trigger_test_suite.outputs.build_id }}
          
          while [[ ("$buildStatus" != "passed" && "$buildStatus" != "failed") ]]; do
            response=$(curl -u ${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }} -s https://lcnc-api.browserstack.com/api/v1/builds/$BUILD_ID/status)
            buildStatus=$(echo $response | jq -r '.build_status')
            sleep $retryInterval
          done
          
          if [[ "$buildStatus" == "passed" ]]; then
            echo "Build passed"
          elif [[ "$buildStatus" == "failed" ]]; then
            echo "Build failed"
            exit 1
          else
            echo "Build status unstable"
            exit 1
          fi
